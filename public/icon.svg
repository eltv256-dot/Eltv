<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e17" />
      <stop offset="50%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Liquid Glass Accent Gradient -->
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)" />
      <stop offset="35%" stop-color="rgba(56,189,248,0.3)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>

    <!-- Play Inner Shadow & Specular -->
    <linearGradient id="playSpecular" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="ambientLight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" />

  <!-- Ambient Underglow -->
  <circle cx="270" cy="256" r="140" fill="#0284c7" opacity="0.25" filter="url(#ambientLight)" />

  <!-- Liquid Glass Outer Border -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#rimGlow)" stroke-width="3" />

  <!-- Inner Soft Bevel Ring -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Glass Arc Sheen (iPhone 18 curved refraction) -->
  <path d="M 50 160 Q 256 90 462 160 Q 256 120 50 160 Z" fill="rgba(255,255,255,0.06)" />

  <!-- The elbill Play Gem -->
  <g filter="url(#softGlow)">
    <!-- Behind-the-play blur glow -->
    <path d="M 204 156 C 204 146 215 140 224 145 L 366 237 C 374 242 374 254 366 259 L 224 351 C 215 356 204 350 204 340 Z" fill="#0284c7" opacity="0.4" />
    
    <!-- Primary Play Prism -->
    <path d="M 200 158 C 200 148 211 142 220 147 L 360 239 C 368 244 368 256 360 261 L 220 353 C 211 358 200 352 200 342 Z" fill="url(#playSpecular)" stroke="rgba(255,255,255,0.6)" stroke-width="2" />
    
    <!-- Specular facet cut -->
    <path d="M 204 165 L 290 250 L 204 335 Z" fill="rgba(255,255,255,0.2)" />
    <path d="M 210 160 L 350 250 L 290 250 Z" fill="rgba(255,255,255,0.35)" />
  </g>

  <!-- Subtle bottom branding tick -->
  <circle cx="256" cy="420" r="4" fill="#38bdf8" opacity="0.8" />
</svg>
